<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa esquemático de Alvaria</title>
  <desc id="desc">O norte montanhoso está ao alto, as planícies ocupam o centro e o leste, e os planaltos ficam ao sul. Dois rios atravessam as áreas agrícolas. Os pontos mostram locais indicativos para obras de água, segurança, energia, emprego e infraestrutura urbana.</desc>
  <defs>
    <clipPath id="country">
      <path d="M297 37 350 48 387 70 431 76 467 102 510 109 527 139 571 155 587 187 630 206 616 246 662 274 646 313 680 345 654 388 618 409 628 449 592 470 582 516 551 540 534 583 493 599 465 642 419 632 391 670 351 650 319 684 285 655 249 647 227 609 188 594 171 561 134 543 145 501 119 467 143 429 118 389 142 354 121 319 146 287 133 249 165 219 150 187 183 159 190 126 226 111 247 77 281 69Z"/>
    </clipPath>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#153e3d" opacity=".13"/>
    </pattern>
  </defs>
  <rect width="820" height="760" fill="#f0f0e9"/>
  <g clip-path="url(#country)">
    <rect x="100" y="20" width="610" height="180" fill="#dfe4d7"/>
    <rect x="100" y="200" width="610" height="260" fill="#e8eadb"/>
    <rect x="100" y="460" width="610" height="250" fill="#d8e0d3"/>
