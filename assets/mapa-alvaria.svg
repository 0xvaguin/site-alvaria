    <path d="M505 161 C476 218 500 264 474 323 C451 377 492 420 518 463 C541 503 533 554 571 590" fill="none" stroke="#5b9cab" stroke-width="9" stroke-linecap="round" opacity=".88"/>
    <path d="M326 273 C383 281 418 302 474 323" fill="none" stroke="#75abb2" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <g fill="#526b62" font-family="system-ui, sans-serif" font-size="13" letter-spacing="1.3">
      <text x="299" y="111">NORTE MONTANHOSO</text>
      <text x="231" y="337">PLANÍCIES CENTRAIS</text>
      <text x="482" y="358">PLANÍCIES DO LESTE</text>
      <text x="318" y="584">PLANALTOS DO SUL</text>
    </g>
    <g fill="#327f94" font-family="system-ui, sans-serif" font-size="10" font-style="italic">
      <text x="337" y="396" transform="rotate(54 337 396)">Rio principal 1</text>
      <text x="495" y="401" transform="rotate(66 495 401)">Rio principal 2</text>
    </g>
    <!-- Northern seismic-resilience works -->
    <g fill="#48566f" stroke="#f0f0e9" stroke-width="3">
      <path d="M390 156 401 136 412 156Z"/><path d="M491 153 502 133 513 153Z"/><path d="M559 193 570 173 581 193Z"/>
    </g>
    <!-- Water storage and basin management -->
    <g fill="#327f94" stroke="#f0f0e9" stroke-width="5">
      <circle cx="321" cy="300" r="11"/><circle cx="387" cy="368" r="11"/><circle cx="488" cy="310" r="11"/>
