<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
  <title id="title">Alvaria — mapa cartográfico esquemático</title>
  <desc id="desc">Mapa em estilo cartográfico de Alvaria, com moldura, indicação do norte, relevo em curvas de nível, rios, regiões e símbolos de infraestrutura. Representação ilustrativa, sem escala ou coordenadas.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f5ed"/><stop offset="1" stop-color="#f1efe5"/></linearGradient>
    <linearGradient id="upland" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8e7d7"/><stop offset="1" stop-color="#dfe5d8"/></linearGradient>
    <clipPath id="country"><path d="M297 37 350 48 387 70 431 76 467 102 510 109 527 139 571 155 587 187 630 206 616 246 662 274 646 313 680 345 654 388 618 409 628 449 592 470 582 516 551 540 534 583 493 599 465 642 419 632 391 670 351 650 319 684 285 655 249 647 227 609 188 594 171 561 134 543 145 501 119 467 143 429 118 389 142 354 121 319 146 287 133 249 165 219 150 187 183 159 190 126 226 111 247 77 281 69Z"/></clipPath>
    <filter id="relief-shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b4d41" flood-opacity=".10"/></filter>
    <pattern id="field-hatch" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M0 11 11 0" stroke="#74836f" stroke-opacity=".20" stroke-width=".6"/></pattern>
    <g id="water"><circle r="9" fill="#f7f5ed" stroke="#34788a" stroke-width="1.5"/><path d="M-5-1q2.5-3 5 0t5 0M-5 3q2.5-3 5 0t5 0" fill="none" stroke="#34788a" stroke-width="1.25" stroke-linecap="round"/></g>
    <g id="works"><rect x="-7" y="-7" width="14" height="14" fill="#f7f5ed" stroke="#526d57" stroke-width="1.5"/><path d="M-4 4v-5l4-3 4 3v5M-2 4V0h4v4" fill="none" stroke="#526d57" stroke-width="1.1" stroke-linejoin="round"/></g>
    <g id="solar"><path d="m0-9 2.5 5.5 6 .5-4.5 4 1.4 6L0 4l-5.4 3 1.4-6-4.5-4 6-.5Z" fill="#d1a153" stroke="#f7f5ed" stroke-width="1.5" stroke-linejoin="round"/></g>
    <g id="urban"><circle r="8" fill="#f7f5ed" stroke="#ae704c" stroke-width="1.5"/><path d="M-4 4V-1l4-3 4 3v5M-2 4V0h4v4" fill="none" stroke="#ae704c" stroke-width="1.1" stroke-linejoin="round"/></g>
    <g id="seismic"><path d="M0-9 9 7H-9Z" fill="#52627a" stroke="#f7f5ed" stroke-width="1.5" stroke-linejoin="round"/><path d="M0-4v5m0 2v.2" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></g>
  </defs>

  <!-- Map sheet and cartographic neatline -->
  <rect width="820" height="760" fill="url(#paper)"/>
  <rect x="20" y="20" width="780" height="720" fill="none" stroke="#8e9488" stroke-width=".8"/>
  <rect x="27" y="27" width="766" height="706" fill="none" stroke="#d5d3c7" stroke-width=".5"/>
  <g stroke="#81887c" stroke-width=".8">
    <path d="M112 20v9M210 20v9M308 20v9M406 20v9M504 20v9M602 20v9M700 20v9M112 731v9M210 731v9M308 731v9M406 731v9M504 731v9M602 731v9M700 731v9"/>
    <path d="M20 116h9M20 214h9M20 312h9M20 410h9M20 508h9M20 606h9M791 116h9M791 214h9M791 312h9M791 410h9M791 508h9M791 606h9"/>
  </g>
  <text x="43" y="51" fill="#344b41" font-family="Georgia,serif" font-size="17" letter-spacing="2">ALVARIA</text>
  <text x="44" y="68" fill="#657066" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" font-weight="600" letter-spacing="1.4">MAPA DE RELEVO E INFRAESTRUTURA</text>
  <text x="774" y="51" text-anchor="end" fill="#667066" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" letter-spacing="1.1">REPÚBLICA FICTÍCIA</text>
  <text x="774" y="67" text-anchor="end" fill="#667066" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" letter-spacing="1.1">PLANO 2026—2036</text>
  <path d="M41 82H779" stroke="#b9b9ac" stroke-width=".8"/>

