    </g>
    <circle cx="444" cy="350" r="7" fill="#153e3d" stroke="#fffefa" stroke-width="4"/>
    <text x="453" y="347" fill="#153e3d" font-family="system-ui, sans-serif" font-size="11">Capital</text>
