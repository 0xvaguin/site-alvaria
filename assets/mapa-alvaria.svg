      <path d="M100 20H710V211c-83 19-147-5-218 2s-111 29-181 3-144 14-211-14Z" fill="#dce1d5"/>
      <path d="M100 210c77 17 139-4 213 13s142 22 214 0 116-2 183-24v264c-63 12-130-8-191 10s-130 5-200-17-146 17-219-12Z" fill="#efeddf"/>
      <path d="M100 452c76 24 139-6 216 6s142 40 220 19 118-14 174-28v271H100Z" fill="url(#upland)"/>
      <path d="M202 239c103-49 214-47 317-8s113 37 166 20v188c-72 20-131-13-208 9s-160-17-275 16Z" fill="url(#field-hatch)" opacity=".52"/>

      <!-- Northern mountain relief: nested, irregular contour lines -->
      <g fill="none" stroke="#7e8b7d" stroke-linecap="round" stroke-linejoin="round">
        <path d="M149 191c35-26 55-53 90-55s47-43 81-43 47 30 78 17 54-35 82-18 46 34 76 25 44 6 77 33" stroke-width="1.45" opacity=".8"/>
        <path d="M167 202c32-22 52-43 81-43s47-39 73-40 47 27 75 15 48-31 73-16 41 31 68 24 40 10 63 28" stroke-width="1.1" opacity=".68"/>
        <path d="M186 211c31-18 48-34 72-33s44-32 67-33 43 24 67 13 42-25 64-12 38 25 60 19 35 10 54 21" stroke-width=".9" opacity=".55"/>
        <path d="M214 180 243 159l18 8 25-31 23 20 28-37 25 25 29-10 20 22 31-22 28 24 31-7 27 20" stroke-width="1.8" opacity=".48"/>
      </g>
      <!-- Central plain and southern plateau contour bands -->
      <g fill="none" stroke="#89927f" stroke-width=".9" opacity=".4">
        <path d="M166 292c74-31 151-28 230 2s143 31 205 4"/><path d="M158 314c82-33 162-28 242 3s135 29 193 4"/><path d="M164 337c76-29 151-26 226 4s128 30 180 7"/>
        <path d="M171 523c73-32 143-27 212 0s139 42 219 9"/><path d="M161 544c82-33 152-27 224 2s133 39 211 7"/><path d="M174 565c74-30 145-25 215 3s126 35 201 6"/><path d="M200 585c60-23 121-21 185 4s115 31 177 8"/>
      </g>

