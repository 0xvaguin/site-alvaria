      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M231 134C249 183 300 211 326 273S337 399 387 463 454 544 478 605" stroke="#faf8f1" stroke-width="12"/><path d="M231 134C249 183 300 211 326 273S337 399 387 463 454 544 478 605" stroke="#397d8d" stroke-width="6"/>
        <path d="M505 161C476 218 500 264 474 323S451 377 492 420 541 503 571 590" stroke="#faf8f1" stroke-width="10"/><path d="M505 161C476 218 500 264 474 323S451 377 492 420 541 503 571 590" stroke="#659ca3" stroke-width="5"/>
        <path d="M326 273C383 281 418 302 474 323" stroke="#faf8f1" stroke-width="7"/><path d="M326 273C383 281 418 302 474 323" stroke="#8ab4b5" stroke-width="3"/>
      </g>
      <g fill="#316f80" font-family="Georgia,serif" font-size="9" font-style="italic"><text x="333" y="390" transform="rotate(54 333 390)">Rio 1</text><text x="494" y="400" transform="rotate(68 494 400)">Rio 2</text></g>

      <!-- Region names in restrained map lettering -->
      <g fill="#45584c" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">
        <text x="320" y="113" text-anchor="middle">NORTE MONTANHOSO</text>
        <text x="271" y="365" text-anchor="middle">PLANÍCIES CENTRAIS</text>
        <text x="548" y="363" text-anchor="middle">PLANÍCIES DO LESTE</text>
        <text x="368" y="610" text-anchor="middle">PLANALTOS DO SUL</text>
      </g>

      <!-- Indicative works: symbols match the legend in the page -->
      <g transform="translate(390 156)"><use href="#seismic"/></g><g transform="translate(491 153)"><use href="#seismic"/></g><g transform="translate(559 193)"><use href="#seismic"/></g>
      <g transform="translate(321 300)"><use href="#water"/></g><g transform="translate(387 368)"><use href="#water"/></g><g transform="translate(488 310)"><use href="#water"/></g>
      <g transform="translate(420 451)"><use href="#solar"/></g><g transform="translate(520 455)"><use href="#solar"/></g>
      <g transform="translate(260 423)"><use href="#works"/></g><g transform="translate(329 447)"><use href="#works"/></g><g transform="translate(385 428)"><use href="#works"/></g>
      <g transform="translate(465 391)"><use href="#urban"/></g><g transform="translate(548 420)"><use href="#urban"/></g><g transform="translate(365 492)"><use href="#urban"/></g>
      <!-- Schematic capital; no invented city name -->
      <circle cx="444" cy="350" r="9" fill="#f7f5ed" stroke="#304c43" stroke-width="1.6"/><circle cx="444" cy="350" r="3" fill="#304c43"/><path d="M453 347h28" stroke="#304c43" stroke-width=".9"/><text x="484" y="350" fill="#304c43" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="8" font-weight="700" letter-spacing=".7">CAPITAL</text>
    </g>
    <path d="M297 37 350 48 387 70 431 76 467 102 510 109 527 139 571 155 587 187 630 206 616 246 662 274 646 313 680 345 654 388 618 409 628 449 592 470 582 516 551 540 534 583 493 599 465 642 419 632 391 670 351 650 319 684 285 655 249 647 227 609 188 594 171 561 134 543 145 501 119 467 143 429 118 389 142 354 121 319 146 287 133 249 165 219 150 187 183 159 190 126 226 111 247 77 281 69Z" fill="none" stroke="#304c43" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- North arrow and index strip; explicitly no scale/coordinates -->
  <g transform="translate(757 113)" fill="#43564b" font-family="system-ui,-apple-system,Segoe UI,sans-serif" text-anchor="middle"><text y="-12" font-size="9" font-weight="700" letter-spacing="1.5">N</text><path d="M0-6 6 8 0 5-6 8Z"/><path d="M0 8v27" fill="none" stroke="#56665b" stroke-width="1"/></g>
  <path d="M44 695H776" stroke="#b9b9ac" stroke-width=".7"/>
  <g transform="translate(47 709)" fill="#647066" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text y="8" font-size="8" font-weight="700" letter-spacing="1.2">LEITURA CARTOGRÁFICA</text><text x="180" y="8" font-size="8" letter-spacing=".7">Relevo e hidrografia esquemáticos · implantação indicativa · sem escala ou coordenadas</text><text x="724" y="8" text-anchor="end" font-size="8" font-weight="700" letter-spacing="1.1">PPLA  /  2036</text></g>
</svg>
